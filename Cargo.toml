[package]
name = "unidpp-signatif"
description = "UniDPP trust integration: delegation trust graph, real multi-suite signatures, revocation with retroactivity, transparency anchoring, graded verification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unidpp/unidpp-signatif"
rust-version = "1.75"

[features]
# Interface-only seam to the Confium threshold-cryptography framework
# (github.com/confium): trait shapes mirroring its session/coordinator
# API. No build dependency on Confium; the real binding is deferred.
default = []
confium = []
# SM2 (GB/T 32918 / GM/T 0003.2) real computation: deterministic
# RFC 6979-style signing over SM3 via the RustCrypto `sm2` crate. With
# the feature off, the suite stays framing-only (see `Suite::deferral`).
sm2 = ["dep:sm2"]
# ML-DSA-65 (FIPS 204) real computation via the `ml-dsa` crate
# (seeded keygen + deterministic signing). With the feature off, the
# suite stays framing-only. MlDsa44/87 remain framed either way.
ml-dsa = ["dep:ml-dsa"]
# SLH-DSA (FIPS 205) integration seam. Deliberately a STUB: enabling it
# does not yet compute SLH-DSA, because the PQ binding crate is
# intentionally not a dependency (build-size and supply-chain review
# pending; see `Suite::unsupported`). The feature is the seam where the
# binding lands: with it on, the SLH-DSA suites route to the
# feature-gated guidance path instead of the default refusal. No
# `unimplemented!` anywhere — every path returns an explicit
# `SignatifError::Unsupported`.
slh-dsa = []

[dependencies]
unidpp-model = { path = "../unidpp-core/crates/model" }
unidpp-transform = { path = "../unidpp-core/crates/transform" }
unidpp-event = { path = "../unidpp-core/crates/event" }
unidpp-verdict = { path = "../unidpp-core/crates/verdict" }
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
p256 = "0.13"
sm2 = { version = "0.13", default-features = false, features = ["dsa", "alloc"], optional = true }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"
