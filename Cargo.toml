[package]
name = "unidpp-signatif"
description = "UniDPP trust integration: delegation trust graph, real multi-suite signatures, revocation with retroactivity, transparency anchoring, graded verification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unidpp/unidpp-signatif"
rust-version = "1.75"

[features]
# Interface-only seam to the Confium threshold-cryptography framework
# (github.com/confium): trait shapes mirroring its session/coordinator
# API. No build dependency on Confium; the real binding is deferred.
default = []
confium = []

[dependencies]
unidpp-model = { path = "../unidpp-core/crates/model" }
unidpp-transform = { path = "../unidpp-core/crates/transform" }
unidpp-event = { path = "../unidpp-core/crates/event" }
unidpp-verdict = { path = "../unidpp-core/crates/verdict" }
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
p256 = "0.13"

[dev-dependencies]
serde_json = "1"
